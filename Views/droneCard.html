<a class="droneCard" href="/masterDetail?id={{droneId}}">
    <img src="{{imagePath}}" alt="{{droneName}}" />
    <div class="drone-info">
        <span class="drone-name">{{droneName}}</span>

        <div class="drone-detail">
            <span class="detail-label">Manufacturer:</span>
            <span class="detail-value">{{manufacturer}}</span>
        </div>

        <div class="drone-detail">
            <span class="detail-label">Flight Time:</span>
            <span class="detail-value">{{flightTime}} min</span>
        </div>

        <div class="drone-detail">
            <span class="detail-label">Range:</span>
            <span class="detail-value">{{maxRange}} m</span>
        </div>

        <div class="drone-detail">
            <span class="detail-label">Camera:</span>
            <span class="detail-value">{{camera}}</span>
        </div>

        <div class="drone-price">
            <span class="price-label">Price</span>
            <span class="price-value">€{{price}}</span>
        </div>
    </div>
</a>
